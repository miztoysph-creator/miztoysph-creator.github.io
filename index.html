<style>
html,body{margin:0;height:100%;background:#0B0920;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#ld{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(70% 50% at 50% 35%,#3A1866,#0B0920 70%)}
#ld img{width:96px;height:96px;border-radius:24px;box-shadow:0 0 0 2px rgba(201,166,255,.55),0 0 40px rgba(178,107,255,.55);animation:p 1.6s ease-in-out infinite}@keyframes p{50%{transform:scale(1.05)}}
#ld .st{color:#F6C453;letter-spacing:8px;font-size:14px}
#ld b{font-size:30px;letter-spacing:.02em}#ld small{opacity:.75;font-size:14px}
.sp{display:none}
@keyframes s{to{transform:rotate(360deg)}}
#ld a{color:#fff;background:linear-gradient(135deg,#B26BFF,#7A2C8C);padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:700}
</style></head><body>
<div id="ld"><img src="icon.png" alt=""><b>Miz Toys</b><div class="st">✦✦✦</div><small>Loading figures… ・ 読み込み中</small></div>
<script>
(function(){
var API="https://script.google.com/macros/s/AKfycbxwr79xgsuR2vhVF7yKa4t3xOW88a_MFa2qlF28XVNGrrLu1G4iklCrQvLhioClRDRC/exec";
function get(q,n){n=n||0;return fetch(API+"?"+q,{credentials:"omit"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
  .catch(function(e){if(n<2)return new Promise(function(ok){setTimeout(ok,1200*(n+1))}).then(function(){return get(q,n+1)});throw e})}
var qs=new URLSearchParams(location.search),card=qs.get("card");
var pre={getCatalog:get("api=catalog")};
if(card)pre.getCard=get("api=card&code="+encodeURIComponent(card));
window.__miz={API:API,pre:pre,get:get};
get("api=page").then(function(html){
  var shim='<script>(function(){var M=window.__miz;'+
   'function call(fn,a,ok,fail){var p=M.pre[fn]&&(fn!=="getCard"||a[0]===new URLSearchParams(location.search).get("card"))?M.pre[fn]:null;if(p)delete M.pre[fn];'+
   'p=p||M.get(fn==="getCatalog"?"api=catalog":"api=card&code="+encodeURIComponent(a[0]||""));p.then(function(t){JSON.parse(t);ok&&ok(t)}).catch(function(e){fail&&fail(e)})}'+
   'function R(ok,fail){return{withSuccessHandler:function(h){return R(h,fail)},withFailureHandler:function(h){return R(ok,h)},getCatalog:function(){call("getCatalog",[],ok,fail)},getCard:function(c){call("getCard",[c],ok,fail)}}}'+
   'window.google={script:{get run(){return R(null,null)},url:{getLocation:function(cb){var p={};new URLSearchParams(location.search).forEach(function(v,k){p[k]=v});cb({parameter:p})}}}};})();<\/script>';
  html=html.replace(/<head>/i,'<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Miztoys 2026 Catalog</title><meta name="theme-color" content="#0B0920"><link rel="icon" type="image/png" href="https://miztoysph-creator.github.io/icon.png"><link rel="apple-touch-icon" href="https://miztoysph-creator.github.io/icon.png">'+shim);
  document.open();document.write(html);document.close();
}).catch(function(){
  document.getElementById("ld").innerHTML='<b>Miz Toys</b><small>The catalog is taking too long to load. Please check your connection and try again.</small><a href="javascript:location.reload()">Try again</a>';
});
})();
</script>
</body></html>
